name: cso_bluesky_bot

on:
  workflow_dispatch:
  schedule:
    # Runs every 30 minutes from 10am-6pm UTC (new datasets published ~11am Irish time)
    - cron: '*/30 10-18 * * *'

jobs:
  check-and-post:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies (macOS)
        run: |
          brew install harfbuzz fribidi freetype

      - name: Install R packages
        run: |
          R -e 'install.packages(c("bskyr", "csodata", "glue", "scales", "tidyverse"))'
      - name: Debug secrets
        run: |
          if [ -z "$BLUESKY_CSOIE_APP_USER" ]; then echo "SECRET IS EMPTY"; else echo "SECRET IS SET (length: ${#BLUESKY_CSOIE_APP_USER})"; fi
        env:
          BLUESKY_CSOIE_APP_USER: ${{ secrets.BLUESKY_CSOIE_APP_USER }}
      - name: Run CSO Bluesky bot
        run: Rscript bot_cso_bluesky.R
        env:
          BLUESKY_CSOIE_APP_USER: ${{ secrets.BLUESKY_CSOIE_APP_USER }}
          BLUESKY_CSOIE_APP_PASS: ${{ secrets.BLUESKY_CSOIE_APP_PASS }}

      - name: Commit updated tracking file
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_tables.csv
          timestamp=$(date -u)
          git commit -m "Update posted tables: ${timestamp}" || exit 0
          git push